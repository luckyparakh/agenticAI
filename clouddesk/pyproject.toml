[project]
name = "clouddesk"
version = "0.1.0"
description = "Autonomous Customer Support & Resolution Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

# This is an application, not a distributable package, so there is no build
# backend and no src/ layout. The import roots are declared in pythonpath below
# and follow the folder layout in CLAUDE.md §4.3.
[tool.uv]
package = false

[tool.pytest.ini_options]
# Offline, session-scoped event loop (CLAUDE.md §13). Do not mix in
# @pytest.mark.asyncio with a different scope.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# `backend` exposes `app.*`; `.` exposes agents/, rag/, memory/, integrations/.
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
